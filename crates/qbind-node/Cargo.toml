[package]
name = "qbind-node"
version = "0.1.0"
edition = "2021"
# Run 382: bridge build-time provenance (git commit / harness build id) into the
# `qbind_node_build_info` metric labels. See build.rs for the safety constraints.
build = "build.rs"

[features]
default = []
# Enable the async peer manager path (T90.1).
# When enabled: uses AsyncPeerManagerImpl for fully async networking.
# When disabled (legacy): uses blocking PeerManager + spawn_blocking path.
async-peer-manager = []
# Enable HSM/PKCS#11 signer backend (T211).
# When enabled: HsmPkcs11Signer is available for hardware security module signing.
# When disabled: SignerMode::HsmPkcs11 produces a clear startup error.
hsm-pkcs11 = []
# Enable test utilities (M16).
# When enabled: Test-only methods like set_inject_write_failure() become available.
# Used by integration tests for failure injection testing.
test-utils = []

[[bin]]
name = "qbind-node"
path = "src/main.rs"

[dependencies]
qbind-wire      = { path = "../qbind-wire" }
qbind-consensus = { path = "../qbind-consensus" }
qbind-runtime   = { path = "../qbind-runtime" }
qbind-ledger    = { path = "../qbind-ledger" }
qbind-crypto    = { path = "../qbind-crypto" }
qbind-types     = { path = "../qbind-types" }
qbind-net       = { path = "../qbind-net" }
qbind-hash      = { path = "../qbind-hash" }
rocksdb        = "0.22"
tokio          = { version = "1.44", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util", "signal"] }
crossbeam-channel = "0.5"
num_cpus       = "1.16"
parking_lot    = "0.12"
thiserror      = "1.0"
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
bincode        = "1.3"
clap           = { version = "4.5", features = ["derive"] }
hex            = "0.4"
sha3           = "0.10"

# Run 381: unix `statvfs(3)` for the qbind-owned data-dir free-space gauge
# (`qbind_node_data_dir_free_bytes`). Already present in the workspace lockfile;
# used only under `cfg(unix)`, non-unix targets omit the gauge.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
qbind-serde  = { path = "../qbind-serde" }
qbind-system = { path = "../qbind-system" }
qbind-ledger = { path = "../qbind-ledger", features = ["test-helpers"] }
tempfile    = "3.10"
proptest    = "1"
parking_lot = "0.12"